name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The tag is v<version>; release.sh takes the bare version and
      # asserts it against AppIdentity, the app bundle, and the daemon CLI.
      - name: Resolve version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      # Draft on purpose: a human checks the assets, then publishes.
      - name: Publish the GitHub release as a draft
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/AudioNap-${{ steps.version.outputs.version }}.zip" \
            "dist/audionapd-${{ steps.version.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --draft \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
