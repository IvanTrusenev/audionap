name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Xcode 27 does not expose SPM test targets to test plans without a
      # workspace, so the package tests run through swift test directly.
      - name: Run Shared package tests
        working-directory: Shared
        run: swift test

      # The app's own test bundle (DaemonStatusTests) runs via xcodebuild.
      - name: Run app tests
        run: xcodebuild -project AudioNap.xcodeproj -scheme AudioNap \
          -destination 'platform=macOS' test

      - name: Build the daemon
        run: xcodebuild -project AudioNap.xcodeproj -scheme audionapd \
          -configuration Debug build
